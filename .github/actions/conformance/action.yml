name: Conformance suite
description: >
  Installs every server and mock the suite needs, then runs unit + e2e with
  OPCUA_TESTS_REQUIRED=1, so a missing dependency fails the run instead of
  skipping a subsystem. The one definition CI, publish and release all use (#142).

# A composite action rather than a reusable workflow on purpose: calling a
# reusable workflow prefixes the job's check name ("E2E — … / <inner job>"), and
# the E2E check names are required status checks in the `main-protection`
# ruleset, matched by exact string. A composite action changes the steps and
# leaves the job — and its name — where it is. The caller checks out first.

inputs:
  python-version:
    description: Python version for uv to run the suite under
    default: "3.13"
  node-version:
    description: Node.js version for both servers and the Node-based mocks
    default: "22"

  evidence-suffix:
    description: Unique artifact suffix for additional backend qualification jobs
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: packages/server-node/package-lock.json

    - name: Build Node server
      shell: bash
      working-directory: packages/server-node
      run: |
        npm ci
        npm run build

    # Both Node-based mocks, always. publish.yml once installed only the first,
    # and every Alarms & Conditions test skipped on every release while the job
    # stayed green. Required mode below now fails that loudly; installing them
    # here is what keeps it from failing at all.
    - name: Install aggregate mock OPC UA server
      shell: bash
      working-directory: packages/mock-server-aggregate
      run: npm ci

    - name: Install alarms mock OPC UA server
      shell: bash
      working-directory: packages/mock-server-alarms
      run: npm ci

    - name: Sync workspace (all packages)
      shell: bash
      run: uv sync --all-packages --python ${{ inputs.python-version }}

    - name: Lint, typecheck and generated contracts
      shell: bash
      run: |
        uv run --no-sync ruff check .
        uv run --no-sync ruff check --select C901 packages/server-python/src/opcua_mcp_server/server.py packages/server-python/src/opcua_mcp_server/application packages/server-python/src/opcua_mcp_server/adapters packages/server-python/src/opcua_mcp_server/protocol packages/server-python/src/opcua_mcp_server/infrastructure
        uv run --no-sync ruff format --check .
        npm run format:check --prefix packages/server-node
        npm run typecheck --prefix packages/server-node
        npm run lint:complexity --prefix packages/server-node
        npm run config:check --prefix packages/server-node

    - name: Node unit evidence
      shell: bash
      working-directory: packages/server-node
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.context/conformance"
        node --throw-deprecation --test --test-reporter=junit \
          --test-reporter-destination="$GITHUB_WORKSPACE/.context/conformance/node-unit.xml" test/*.test.mjs
    - name: Validate standard schemas and generated contract types
      shell: bash
      run: uv run --no-sync python scripts/contract_codegen.py --check

    - name: Run unit and end-to-end tests (required mode)
      shell: bash
      working-directory: tests
      env:
        OPCUA_TESTS_REQUIRED: "1"
        OPCUA_SUITE_REPORT: ${{ github.workspace }}/.context/conformance/pytest.json
      run: uv run --no-sync pytest -v e2e/ unit/

    - name: Build compatibility evidence
      shell: bash
      run: |
        uv run --no-sync python scripts/compatibility_report.py \
          --pytest .context/conformance/pytest.json --node-junit .context/conformance/node-unit.xml \
          --output .context/conformance/runtime-compatibility.json

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: conformance-${{ inputs.python-version }}-${{ inputs.node-version }}${{ inputs.evidence-suffix }}
        path: .context/conformance/*
        if-no-files-found: error
