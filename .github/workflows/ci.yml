name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: runs in ~30s and does not need the mock OPC UA server, so it
  # reports long before the end-to-end suite finishes.
  lint:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint (Python)
        run: uv run ruff check .

      - name: Ruff format check (Python)
        run: uv run ruff format --check .

      - name: Install Node dependencies
        working-directory: packages/server-node
        run: npm ci

      - name: Prettier check (TypeScript)
        working-directory: packages/server-node
        run: npm run format:check

      - name: Typecheck (TypeScript)
        working-directory: packages/server-node
        run: npm run typecheck

      # The `.mcpb` form and server.json's environment variables are generated
      # from contract/config.json (#133). A step of its own, rather than only the
      # unit test that also checks it, so the failure names the command to run.
      - name: Generated config metadata matches contract/config.json
        working-directory: packages/server-node
        run: npm run config:check

      # Unit tests need no mock OPC UA server: seconds, not the ~50s e2e suite.
      - name: Build Node server
        working-directory: packages/server-node
        run: npm run build

      - name: Unit tests (Node)
        working-directory: packages/server-node
        run: npm test

      - name: Unit tests (Python)
        working-directory: tests
        run: uv run --no-sync pytest -v unit/

  e2e:
    # Covers the versions the manifests actually claim: the declared floors
    # (requires-python >=3.10, engines.node >=22.13) and current/latest.
    #
    # NOTE: these names are required status checks in the `main-protection`
    # ruleset, which matches on the exact string — see the note on `smoke` below.
    # Changing a version here changes the check name, so the ruleset has to be
    # updated in the same breath or the merge gate can never be satisfied.
    name: E2E — Python ${{ matrix.python-version }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            node-version: "22"
          - python-version: "3.13"
            node-version: "22"
          - python-version: "3.13"
            node-version: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      - name: Install aggregate mock OPC UA server
        working-directory: packages/mock-server-aggregate
        run: npm ci

      - name: Install alarms mock OPC UA server
        working-directory: packages/mock-server-alarms
        run: npm ci

      - name: Sync workspace (all packages)
        run: uv sync --all-packages --python ${{ matrix.python-version }}

      - name: Run end-to-end tests
        working-directory: tests
        run: uv run --no-sync pytest -v e2e/ unit/

  # Builds every artifact a user can actually download — npm tarball, Python
  # wheel, the `.mcpb` bundle and both single-file executables — installs them
  # somewhere isolated, and drives them over MCP. The rest of CI runs from the
  # source tree and from uv.lock, so it cannot see packaging faults, an unbounded
  # dependency resolving to a breaking major, or a bundling change that only
  # breaks once node_modules is no longer on disk.
  #
  # The executables cannot be cross-compiled, so this covers Linux only; the
  # release workflow builds and checks macOS and Windows.
  smoke:
    # NOTE: this name is a required status check in the `main-protection`
    # ruleset, which matches on the exact string. Changing it here alone makes
    # the required check one that never runs, and the merge gate can then never
    # be satisfied — which is what happened when it was renamed once already.
    # Change both, in this order: push the workflow so a run reports under the
    # new name, then update the ruleset to require it.
    name: Downloadable artifacts (npm, wheel, .mcpb, executables)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      # `--group packaging` brings in PyInstaller, which only the single-file
      # executable needs; the other jobs deliberately do without it.
      - name: Sync workspace (all packages)
        run: uv sync --all-packages --group packaging

      - name: Run artifact smoke tests
        working-directory: tests
        run: uv run --no-sync pytest -v -m smoke smoke/

  # Windows and macOS, which nothing else in CI touches. The platform branches
  # this exercises are real and were covered only by unit tests that pass a faked
  # `platform` string: `install.py` resolves a different config path per OS (the
  # `%APPDATA%` fallback among them), and `index.ts`'s `isEntryPoint()` compares
  # `process.argv[1]` through `realpathSync`, where Windows junctions behave
  # unlike POSIX symlinks. Windows is also where most SCADA stacks and most
  # Claude Desktop installs live.
  #
  # Unit plus smoke, not the full e2e suite: e2e drives three mock OPC UA servers
  # and takes ~10 minutes, and running it three more times buys far less than the
  # packaging and path coverage does. `release.yml` already builds the executables
  # on all three OSes — but only builds them, with no suite behind it, so a
  # Windows regression was discoverable by cutting a release and not before.
  #
  # NOTE: deliberately *not* yet a required status check in the `main-protection`
  # ruleset. Adding a required check that has never run on this repository is how
  # a merge gate becomes unsatisfiable; promote it once it has been green for a
  # few PRs, following the order described on `smoke` above.
  cross-platform:
    name: Unit & artifacts — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      - name: Unit tests (Node)
        working-directory: packages/server-node
        run: npm test

      # `--group packaging` brings in PyInstaller for the executable the smoke
      # tests build, which is the artifact most likely to differ per platform.
      - name: Sync workspace (all packages)
        run: uv sync --all-packages --group packaging

      - name: Unit tests (Python)
        working-directory: tests
        run: uv run --no-sync pytest -v unit/

      - name: Run artifact smoke tests
        working-directory: tests
        run: uv run --no-sync pytest -v -m smoke smoke/
