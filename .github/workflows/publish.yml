name: Publish

# Tag-triggered so a release is never a hand-run command that can skip a step.
# The npm package in particular needs `npm run build` to stage build/contract.json
# and build/version.json; publishing without it ships a package that dies at
# startup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A tag push can be delivered more than once — v0.3.0 queued two identical runs a
# second apart. The registry jobs are individually idempotent, but two running at
# the same moment can both see a version as unpublished and both try to claim it,
# leaving a red X on a release that actually succeeded. Never cancel in progress:
# interrupting a publish mid-upload is worse than a duplicate.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      - name: Install aggregate mock OPC UA server
        working-directory: packages/mock-server-aggregate
        run: npm ci

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Tag must match the manifests
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/server-node/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Full test suite
        working-directory: tests
        run: uv run --no-sync pytest -v

      - name: Artifact smoke tests
        working-directory: tests
        run: uv run --no-sync pytest -v -m smoke smoke/

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Build
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      # Idempotent: a partial release (one registry succeeding, the other failing)
      # must be safe to re-run without a version bump.
      - name: Publish
        working-directory: packages/server-node
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "opcua-mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "opcua-mcp-server@$VERSION already on npm — skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build --out-dir dist packages/server-python

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Same reason as the npm job: re-running a partial release must not fail.
          skip-existing: true
