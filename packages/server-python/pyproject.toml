[project]
name = "opcua-mcp-server"
version = "0.3.0"
description = "MCP server exposing OPC UA read/write/browse/method/history tools (MCPServer + python-opcua)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    # Upper bound is load-bearing: 2.x renamed FastMCP to MCPServer and moved the
    # client models to snake_case, and 3.x is free to do the same again. The
    # server targets the 2.x API (`mcp.server.mcpserver`), so 1.x no longer works
    # either — hence a floor, not just a ceiling.
    "mcp[cli]>=2.2.0,<3",
    "opcua>=0.98.13",
]

[project.scripts]
opcua-mcp-server = "opcua_mcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opcua_mcp_server"]

# The contract is injected into the wheel by hatch_build.py rather than by a
# static force-include, because the path differs between a checkout and an
# unpacked sdist. See that file for the full explanation.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# The sdist must be self-contained: it carries its own copy of the contract (and
# the build hook) so that building a wheel from it works outside a checkout.
[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"../../contract/tools.json" = "contract/tools.json"
