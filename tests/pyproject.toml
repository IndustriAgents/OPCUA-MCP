[project]
name = "opcua-mcp-tests"
version = "0.1.0"
description = "Test suite for the OPC UA MCP servers (Python + Node)"
requires-python = ">=3.10"
dependencies = [
    # The secure end-to-end tests generate their own throwaway OPC UA
    # certificates rather than shipping a committed key pair.
    "cryptography>=50.0.1,<51",
    # Upper bound is load-bearing: 2.x renamed FastMCP to MCPServer and moved the
    # client models to snake_case, and 3.x is free to do the same again. The
    # server targets the 2.x API (`mcp.server.mcpserver`), so 1.x no longer works
    # either — hence a floor, not just a ceiling.
    "mcp[cli]>=2.2.0,<3",
    "opcua>=0.98.13,<0.99",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "anyio>=4.15.1",
    # tomllib is stdlib from 3.11; the tests read pyproject files to check
    # version parity, so older interpreters need the backport.
    "tomli>=2; python_version<'3.11'",
]

# Not a distributable: this is a test suite, not a package. Without this, the
# build backend tries to package unit/, e2e/ and smoke/ as three top-level
# packages and fails. uv still resolves and installs the dependencies below.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Smoke tests build and install real artifacts, so they are slow and opt-in.
# CI runs them as their own job with `-m smoke`.
addopts = "-ra -m 'not smoke'"
# Lets test modules import `conftest` and each other by name from subdirectories.
pythonpath = ["."]
markers = [
    "smoke: builds and installs the packaged artifacts (slow; deselected by default)",
]
